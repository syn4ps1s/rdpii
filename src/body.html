  <canvas id="speedlines"></canvas>
  <div id="dangerOverlay"></div>
  <div id="fx"></div>
  <div id="touch" hidden></div>
  <div id="ui">
    <div id="hud" hidden></div>
    <div id="toasts" aria-live="polite"></div>

    <div id="screens"></div>

  <div id="boot">RED DEAD PAW II</div>
</div>
